<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Authentication</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h2>User Authentication</h2>
    </header>

    <div id="message-box" class="message hidden"></div>

    <div id="auth-forms">
      <div class="tab-buttons">
        <button id="show-login-btn" class="active" onclick="showForm('login')">Login</button>
        <button id="show-register-btn" onclick="showForm('register')">Register</button>
      </div>

      <div id="login-section" class="form-card">
        <h3>Login</h3>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email Address:</label>
            <input type="email" id="login-email" required placeholder="Enter email" />
          </div>
          <div class="form-group">
            <label>Password:</label>
            <input type="password" id="login-password" required placeholder="Enter password" />
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>

      <div id="register-section" class="form-card hidden">
        <h3>Register New User</h3>
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Full Name:</label>
            <input type="text" id="reg-name" required placeholder="Enter name" />
          </div>
          <div class="form-group">
            <label>Email Address:</label>
            <input type="email" id="reg-email" required placeholder="Enter email" />
          </div>
          <div class="form-group">
            <label>Password:</label>
            <input type="password" id="reg-password" minlength="6" required placeholder="Enter password" />
          </div>
          <button type="submit" class="btn btn-primary">Register</button>
        </form>
      </div>
    </div>

    <div id="dashboard-section" class="dashboard-card hidden">
      <h3>Welcome, <span id="user-display-name">User</span></h3>
      <p><strong>Email:</strong> <span id="user-display-email"></span></p>
      <button onclick="handleLogout()" class="btn btn-danger">Logout</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
